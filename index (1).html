<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Trắc Nghiệm Tin Học Cơ Bản (40 Câu)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f0f4f8; color: #1e293b; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 35px; }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 25px; font-size: 24px; font-weight: 700; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; background: #eff6ff; padding: 14px 20px; border-radius: 8px; margin-bottom: 25px; font-weight: 600; color: #1d4ed8; font-size: 16px; }
        .question-card { margin-bottom: 25px; padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .question-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: #111827; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: #fdfdfd; }
        .option-item:hover { background: #f1f5f9; border-color: #94a3b8; }
        .option-item input { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }
        .option-item label { cursor: pointer; width: 100%; font-size: 15px; font-weight: 500; color: #1f2937; }
        .btn-submit { display: block; width: 100%; background: #10b981; color: white; border: none; padding: 16px; font-size: 17px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: background 0.2s; margin-top: 25px; box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
        .btn-submit:hover { background: #059669; }
        #result-box { display: none; margin-top: 30px; padding: 25px; border-radius: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; text-align: center; }
        #result-box h2 { color: #166534; margin-bottom: 12px; font-size: 24px; }
        #result-box p { font-size: 18px; color: #15803d; font-weight: 600; line-height: 1.8; }
        .feedback-ans { margin-top: 12px; font-size: 15px; font-weight: 600; display: none; padding: 8px 12px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ÔN TẬP TRẮC NGHIỆM TIN HỌC CƠ BẢN (40 CÂU)</h1>
        <div class="quiz-header">
            <span>Thang điểm: 10.0 (Đúng +0.25đ, Sai/Trống -0.25đ)</span>
            <span id="question-count">Tổng số câu: 40</span>
        </div>
        <form id="quiz-form">
            <div id="questions-container"></div>
            <button type="button" class="btn-submit" onclick="submitQuiz()">Nộp Bài & Chấm Điểm 📝</button>
        </form>
        <div id="result-box">
            <h2>Kết Quả Bài Làm</h2>
            <p id="score-text"></p>
        </div>
    </div>
    <script>
        const questions = [{"question": "Phát biểu nào chưa đúng?", "choices": ["a. Phần mềm thương mại - Commercia Software: có đăng ký bản quyền, không cho phép sao chép dưới bất kỳ hình thức nào", "b. Phần mềm mã nguồn mở - Open Source Software: có đăng ký bản quyền, không cho phép sao chép dưới bất kỳ hình thức nào", "c. Phần mềm miễn phí - Freeware: cho phép người khác tự do sử dụng hoàn toàn hoặc theo một số yêu cầu bắt buộc. Ví dụ kèm tên tác giả", "d. Phần mềm chia sẻ - Shareware: có bản quyền, dùng thử trước khi mua. Nếu muốn tiếp tục sử dụng chương trình thì được khuyến khích trả tiền cho tác giả"], "answer": "Đáp án đúng là: Phần mềm mã nguồn mở - Open Source Software: có đăng ký bản quyền, không cho phép sao chép dưới bất kỳ hình thức nào"}, {"question": "Trong bảng tính Excel công thức Round(7475.47,-2) trả về kết quả bao nhiêu?", "choices": ["a. 7475.47", "b. 7480", "c. 7475", "d. 7500"], "answer": "Đáp án đúng là: 7500"}, {"question": "Trong Word muốn hiển thị đường biên văn bản ta thực hiện", "choices": ["a. View/Options/Advanced/đánh dấu lựa chọn Show Text Boundaries", "b. File/Options/Advanced/đánh dấu lựa chọn Show Text Boundaries", "c. Insert/Options/Advanced/đánh dấu lựa chọn Show Text Boundaries", "d. Home/Options/Advanced/đánh dấu lựa chọn Show Text Boundaries"], "answer": "Đáp án đúng là: File/Options/Advanced/đánh dấu lựa chọn Show Text Boundaries"}, {"question": "Đâu là tùy chọn cho phép lưu trang web mà không có ảnh?", "choices": ["a. Chọn Web page/ Html only", "b. Chọn Text file", "c. Chọn Web page/ Home", "d. Chọn Web page/ complete"], "answer": "Đáp án đúng là: Chọn Web page/ Html only"}, {"question": "Đáp án nào sau đây đúng? Khi nhập dữ liệu vào bảng tính Excel thì:", "choices": ["a. Dữ liệu kiểu ký tự sẽ mặc định căn lề trái", "b. Dữ liệu kiểu số sẽ mặc định căn lề trái", "c. Dữ liệu kiểu thời gian sẽ mặc định căn lề trái", "d. Dữ liệu kiểu ngày tháng sẽ mặc định căn lề trái"], "answer": "Đáp án đúng là: Dữ liệu kiểu ký tự sẽ mặc định căn lề trái"}, {"question": "In Word để in một trang hiện hành ta làm thế nào?", "choices": ["a. Nhấn Ctr + P, Chọn This Page", "b. Nhấn Ctr + P, chọn Only Page", "c. Nhấn Ctr + P, chọn Current Page", "d. Nhấn Ctr + P, Chọn Selection Page"], "answer": "Đáp án đúng là: Nhấn Ctr + P, chọn Current Page"}, {"question": "Muốn định dạng trang in theo hướng chiều ngang trang giấy ta chọn:", "choices": ["a. Tất cả đều sai", "b. Page Layout\\ Orientation\\Portrait", "c. Page Layout\\ Orientation\\landscape", "d. Page Layout\\Landscape"], "answer": "Đáp án đúng là: Page Layout\\ Orientation\\landscape"}, {"question": "Trong Word chức năng Lower Case có tác dụng?", "choices": ["a. Viết thường ký tự đầu tiên và viết hoa các ký tự còn lại", "b. Viết hoa ký tự đầu tiên và viết thường các ký tự còn lại", "c. Viết thường toàn bộ đoạn văn được chọn", "d. Viết thường ký tự đầu tiên"], "answer": "Đáp án đúng là: Viết thường toàn bộ đoạn văn được chọn"}, {"question": "Trong Word bảng có kích thước 5x6 có nghĩa là", "choices": ["a. Bảng gồm 30 cột", "b. Bảng gồm 5 cột 6 dòng", "c. Bảng gồm 30 dòng", "d. Bảng gồm 5 dòng 6 cột"], "answer": "Đáp án đúng là: Bảng gồm 5 cột 6 dòng"}, {"question": "Trong Word tổ hợp phím Ctrl+J dùng để làm gì?", "choices": ["a. Căn giữa văn bản", "b. Căn văn bản đều hai bên", "c. Căn lề phải văn bản", "d. Căn lề trái văn bản"], "answer": "Đáp án đúng là: Căn văn bản đều hai bên"}, {"question": "Chương trình được sử dụng để xem các trang Web được gọi là gì?", "choices": ["a. Chương trình xem Web", "b. Bộ duyệt Web", "c. Phần mềm xem Web", "d. Trình duyệt Web"], "answer": "Đáp án đúng là: Trình duyệt Web"}, {"question": "Khi muốn sắp xếp các biểu tượng trên Desktop ta tiến hành cách nào sau đây?", "choices": ["a. Nhấp chuột phải lên nút Start, chọn Arrange Icons By…", "b. Nhấp chuột phải trên Desktop, chọn Arrange Icons By…", "c. Nhấp chuột phải lên nút Start, chọn New Shortcut…", "d. Nhấp chuột phải lên Computer, chọn Arrange Icons By…"], "answer": "Đáp án đúng là: Nhấp chuột phải trên Desktop, chọn Arrange Icons By…"}, {"question": "Trong Word, để đính kèm văn bản vào Email ta thực hiện:", "choices": ["a. Vào File/Save & Send/ Send Using E_mail", "b. Vào View/Save & Send/ Send Using E_mail", "c. Vào Home/Save & Send/ Send Using E_mail", "d. Vào Insert/Save & Send/ Send Using E_mail"], "answer": "Đáp án đúng là: Vào File/Save & Send/ Send Using E_mail"}, {"question": "Thiết bị nào thực hiện thao tác xuất ra dữ liệu trong số các thiết bị sau: Màn hình, máy in, bàn phím, máy chiếu, ổ đĩa mềm, chuột, loa, máy quét?", "choices": ["a. Bàn phím, chuột, máy quét, máy in", "b. Màn hình, Máy in, máy chiếu, loa", "c. Màn hình, ổ đĩa cứng, ổ đĩa mềm, bàn phím", "d. Máy in, màn hình, máy quét, chuột"], "answer": "Đáp án đúng là: Màn hình, Máy in, máy chiếu, loa"}, {"question": "Trong hệ điều hành Windows, muốn chọn tất cả các đối tượng trong một cửa sổ, ta sử dụng cách nào sau đây?", "choices": ["a. Không có đáp án đúng", "b. Nhấn tổ hợp phím Ctrl + A", "c. Nhấn tổ hợp phím Alt + Tab", "d. Nhấn tổ hợp phím Ctrl + Shift + A"], "answer": "Đáp án đúng là: Nhấn tổ hợp phím Ctrl + A"}, {"question": "Trong bảng tính Microsoft Excel, tại ô A2 gõ vào công thức =MAX(3,14,-25,5) cho kết quả:", "choices": ["a. 5", "b. -25", "c. 3", "d. 14"], "answer": "Đáp án đúng là: 14"}, {"question": "Trong Word chức năng nào sau đây dùng để thay đổi kiểu chữ?", "choices": ["a. Tab Home/ nhóm Font/ Increase Font Size", "b. Tab Home/ nhóm Font/ Change Case", "c. Tab Home/ nhóm Font/ Subscript", "d. Tab Home/ nhóm Font/ Decrease Font Size"], "answer": "Đáp án đúng là: Tab Home/ nhóm Font/ Change Case"}, {"question": "Trong Recycle Bin, để biết chính xác vị trí của một file đã xoá, có thể sử dụng cách nào sau đây?", "choices": ["a. Kích View, chọn Details", "b. Xem phần Details trong khung bên trái màn hình", "c. Kích chuột phải tại file, chọn Properties", "d. Không có đáp án đúng"], "answer": "Đáp án đúng là: Kích View, chọn Details"}, {"question": "Trong Word lề trang tài liệu là gì", "choices": ["a. Là khoảng cách ảo được đo bằng thước ngang", "b. Là khoảng cách trong tài liệu", "c. Là khoảng cách giữa cạnh giấy và văn bản trong tài liệu", "d. Là khoảng cách được tạo do người trình bày văn bản thiết lập"], "answer": "Đáp án đúng là: Là khoảng cách giữa cạnh giấy và văn bản trong tài liệu"}, {"question": "Trong Word để thay đổi hướng chữ trong một ô trong bảng ta làm thế nào?", "choices": ["a. Chọn ô cần thay đổi hướng chữ/Vào Tab Insert/ Design/ Chọn Text Direction", "b. Chọn ô cần thay đổi hướng chữ/Vào Tab Insert/ Layout/ Text Direction", "c. Chọn ô cần thay đổi hướng chữ/Vào Tab Table Tools/ Design/ Chọn Text Direction", "d. Chọn ô cần thay đổi hướng chữ/Vào Tab Table Tools/ Layout/ Text Direction"], "answer": "Đáp án đúng là: Chọn ô cần thay đổi hướng chữ/Vào Tab Table Tools/ Layout/ Text Direction"}, {"question": "Trong hệ điều hành Windows, muốn khôi phục đối tượng đã xóa, mở cửa sổ Recycle Bin và thực hiện thao tác nào sau đây?", "choices": ["a. Kích chuột phải tại đối tượng, chọn Cut", "b. Kích chuột phải tại đối tượng, chọn Properties", "c. Kích chuột phải tại đối tượng, chọn Restore", "d. Không có đáp án đúng"], "answer": "Đáp án đúng là: Kích chuột phải tại đối tượng, chọn Restore"}, {"question": "Trong PowerPoint, lệnh nào sau đây cho phép chèn biểu tượng mặt cười Smiley Face?", "choices": ["a. Vào Insert / Smiley Face", "b. Vào Insert / Shapes / Smiley Face", "c. Vào View / Smiley Face", "d. Vào View / Shapes / Smiley Face"], "answer": "Đáp án đúng là: Vào Insert / Shapes / Smiley Face"}, {"question": "Chức năng lọc trong hộp thư đến không thể sắp xếp thư theo trình tự nào?", "choices": ["a. Sắp xếp thư theo người gửi", "b. Sắp xếp thư theo chủ đề", "c. Sắp xếp thư theo dung lượng file đính kèm", "d. Sắp xếp thư theo ngày nhận"], "answer": "Đáp án đúng là: Sắp xếp thư theo dung lượng file đính kèm"}, {"question": "Cách đặt mật khẩu cho file Excel?", "choices": ["a. File\\Save\\Tools\\Properties", "b. Không có đáp án đúng", "c. File\\Save\\Tools\\Web Option", "d. File\\Save\\Tools\\General Options"], "answer": "Đáp án đúng là: File\\Save\\Tools\\General Options"}, {"question": "Trong Powerpoint, thao tác File/Save dùng để làm gì?", "choices": ["a. Xóa file hiện tại", "b. Lưu file hiện tại", "c. Sao chép file hiện tại", "d. Đóng file hiện tại"], "answer": "Đáp án đúng là: Lưu file hiện tại"}, {"question": "Trong trình duyệt Internet Explorer, để lưu một bức ảnh về máy tính, ta làm như thế nào?", "choices": ["a. Chọn Tools/ Save picture as", "b. Hai cách a và c đều đúng", "c. Nhấn chuột phải vào ảnh, chọn Save picture as", "d. Kích đúp vào ảnh rồi chọn Download"], "answer": "Đáp án đúng là: Nhấn chuột phải vào ảnh, chọn Save picture as"}, {"question": "Để văn bản trong ô được chọn có kiểu chữ nghiêng và gạch chân ta chọn tổ hợp phím nào sau:", "choices": ["a. Ctrl+U, Ctrl+I", "b. Ctrl+F, Ctrl+I", "c. Ctrl+B, Ctrl+I", "d. Ctrl+H, Ctrl+I"], "answer": "Đáp án đúng là: Ctrl+U, Ctrl+I"}, {"question": "Trong Microsoft Excel muốn tính tổng của vùng E2:E8 với điều kiện là \"Máy tính\" trong vùng dữ liệu A2:A8, ta có công thức:", "choices": ["a. SUMIF(A2:A8,E2:E8,\"Máy tính\")", "b. SUMIF(A2:A8,\"Máy tính\")", "c. SUMIF(\"Máy tính\",A2:A8,E2:E8)", "d. SUMIF(A2:A8,\"Máy tính\",E2:E8)"], "answer": "Đáp án đúng là: SUMIF(A2:A8,\"Máy tính\",E2:E8)"}, {"question": "Trong Powerpoint, cách nào để đánh số trang cho các Slide?", "choices": ["a. View/ Slide Number", "b. Insert/ Slide Number", "c. Format/ Slide Number", "d. Home/ Slide Number"], "answer": "Đáp án đúng là: Insert/ Slide Number"}, {"question": "Máy điện tử dùng để thu và lưu giữ hình ảnh một cách tự động thay vì phải dùng phim ảnh là máy gì?", "choices": ["a. Máy ảnh kỹ thuật số", "b. Máy ảnh thường", "c. Webcam", "d. Máy quét ảnh"], "answer": "Đáp án đúng là: Máy ảnh kỹ thuật số"}, {"question": "Trong Powerpoint, cách nào để lựa chọn bố cục cho Slide đã chọn gồm tiêu đề và nội dung?", "choices": ["a. Home/Slide Design", "b. Home/Layout/Title Slide", "c. Home/Layout/Title Slide", "d. Home/Layout/Title and Content"], "answer": "Đáp án đúng là: Home/Layout/Title and Content"}, {"question": "Khi công thức bị sai, ta có thể gỡ rối đoạn công thức đó bằng phím nào ?", "choices": ["a. F12", "b. F10", "c. F11", "d. F9"], "answer": "Đáp án đúng là: F9"}, {"question": "Tệp hoặc thư mục có thuộc tính chỉ đọc là thuộc tính nào?", "choices": ["a. Read Only", "b. Hidden", "c. Modify", "d. Delete"], "answer": "Đáp án đúng là: Read Only"}, {"question": "Nơi để cho người dùng Internet trao đổi thảo luận và tán gẫu nhau là gì?", "choices": ["a. Forum", "b. Blog", "c. Website", "d. Chatroom"], "answer": "Đáp án đúng là: Forum"}, {"question": "Bàn phím máy tính là thiết bị nào trong các thiết bị sau?", "choices": ["a. Thiết bị nhập thông tin", "b. Thiết bị xuất thông tin", "c. Thiết bị lưu trữ thông tin", "d. Thiết bị thoát thông tin"], "answer": "Đáp án đúng là: Thiết bị nhập thông tin"}, {"question": "Trong Word để chèn vào văn bản ký hiệu ® ta thực hiện các bước:", "choices": ["a. Insert/ Symbol/ More Symbols/ Special Character", "b. Insert/ Symbol/ More Symbols/ Wingdings", "c. Insert/ Symbol/ More Symbols/ Symbol/ Special Character", "d. Insert/ Symbol/ More Symbols/ Webdings"], "answer": "Đáp án đúng là: Insert/ Symbol/ More Symbols/ Special Character"}, {"question": "Để khởi động chức năng tìm kiếm thông tin trong Windows, thao tác nào sau đây không đúng?", "choices": ["a. Kích chuột phải tại Desktop, chọn Search", "b. Nhập từ khóa trong ô tìm kiếm trên Windows Explorer, sau đó chọn Date Modified và Size để tìm kiếm theo ngày sửa và kích thước file", "c. Kích nút Search trong cửa sổ My Computer", "d. Kích nút Start, chọn Search"], "answer": "Đáp án đúng là: Kích chuột phải tại Desktop, chọn Search"}, {"question": "Trong bảng tính Excel, ô A5 chứa “TRAN” và ô B5 chứa “ANH”. Để ổ D5 cho kết quả là “TRAN ANH” (có 1 khoảng trắng ở giữa), ta thực hiện công thức như sau:", "choices": ["a. A5 &“ “& B5", "b. A5 + B5", "c. A5 & B5", "d. A5 + “ “ + B5"], "answer": "Đáp án đúng là: A5 &“ “& B5"}, {"question": "Đâu là thiết bị lưu trữ dữ liệu?", "choices": ["a. Cần điểu khiển", "b. Máy in", "c. USB", "d. Webcam"], "answer": "Đáp án đúng là: USB"}, {"question": "Trong Powerpoint, cách nào để mở 1 bản trình bày (Presentation) có sẵn trong máy tính?", "choices": ["a. File/Edit", "b. File/Open", "c. File/Save", "d. File/Close"], "answer": "Đáp án đúng là: File/Open"}];
        function renderQuiz() {
            const container = document.getElementById('questions-container');
            let html = '';
            questions.forEach((q, index) => {
                let optionsHtml = '';
                q.choices.forEach((choice, cIndex) => {
                    optionsHtml += `
                        <div class="option-item">
                            <input type="radio" name="question_${index}" value="${choice}" id="q_${index}_c_${cIndex}">
                            <label for="q_${index}_c_${cIndex}">${choice}</label>
                        </div>
                    `;
                });
                html += `
                    <div class="question-card" id="card_${index}">
                        <div class="question-title">Câu ${index + 1}: ${q.question}</div>
                        <div class="options-list">${optionsHtml}</div>
                        <div class="feedback-ans" id="feedback_${index}"></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        function submitQuiz() {
            if (!confirm("Bạn có chắc chắn muốn nộp bài và xem điểm không?")) return;
            let correctCount = 0, incorrectCount = 0, unansweredCount = 0;
            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question_${index}"]:checked`);
                const feedbackDiv = document.getElementById(`feedback_${index}`);
                feedbackDiv.style.display = 'block';
                let rawAns = q.answer.toLowerCase();
                let ansText = rawAns.includes(':') ? rawAns.split(':')[1].trim() : rawAns.trim();
                if (selected) {
                    let userVal = selected.value.toLowerCase();
                    let userContent = userVal.includes('.') ? userVal.split('.')[1].trim() : userVal.trim();
                    let standardContent = ansText.includes('.') ? ansText.split('.')[1].trim() : ansText.trim();
                    if (userVal === ansText || userContent === standardContent || ansText.includes(userContent) || userContent.includes(standardContent)) {
                        correctCount++;
                        feedbackDiv.innerHTML = `✅ Chính xác! (${q.answer})`;
                        feedbackDiv.style.backgroundColor = '#dcfce7';
                        feedbackDiv.style.color = '#166534';
                    } else {
                        incorrectCount++;
                        feedbackDiv.innerHTML = `❌ Sai rồi. Đáp án đúng: ${q.answer}`;
                        feedbackDiv.style.backgroundColor = '#fee2e2';
                        feedbackDiv.style.color = '#991b1b';
                    }
                } else {
                    unansweredCount++;
                    feedbackDiv.innerHTML = `⚠️ Chưa trả lời. Đáp án đúng: ${q.answer}`;
                    feedbackDiv.style.backgroundColor = '#fef3c7';
                    feedbackDiv.style.color = '#92400e';
                }
            });
            let rawScore = (correctCount * 0.25) - (incorrectCount * 0.25);
            let finalScore = Math.max(0, rawScore).toFixed(2);
            const resultBox = document.getElementById('result-box');
            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `Số câu đúng: ${correctCount}/${questions.length} | Số câu sai: ${incorrectCount} | Chưa trả lời: ${unansweredCount}<br>⭐ <b>ĐIỂM SỐ CỦA BẠN: ${finalScore} / 10.0 điểm</b>`;
            resultBox.style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
        window.onload = renderQuiz;
    </script>
</body>
</html>
